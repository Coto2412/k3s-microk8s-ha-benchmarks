---
# Variables globales del clúster microk8s (mapean la tabla conceptual de la tesis)

# Canal de snap que fija la serie exacta de Kubernetes a instalar.
# 1.36/stable alinea la versión con k3s v1.36.3+k3s1 para una comparación justa de consumo.
# Combinado con snap_refresh_timer (hold forever), el revision del snap queda congelado.
microk8s_channel: 1.36/stable

# Controla las actualizaciones automáticas del snap de MicroK8s:
# "forever" desactiva el auto-refresh; un valor tipo "24h" o "2026-12-31T00:00:00Z" lo difiere.
snap_refresh_timer: forever

# Flag --worker para nodos de cómputo puro (no tocan el plano de control ni el quórum de dqlite).
# false por defecto = el nodo se une como plano de control (HA). Poner true solo en Workers.
microk8s_worker_flag: false

# SANs adicionales que se agregan a csr.conf.template en los MASTER para que los certificados
# del API server validen la IP virtual del plano de control (VIP de kube-vip).
microk8s_extra_sans:
  - "{{ vip_address }}"

# kube-vip: versión de imagen fijada (pinned) para reproducibilidad.
# Verificar última estable en https://github.com/kube-vip/kube-vip/releases
# antes del primer despliegue real.
kube_vip_version: v1.2.4
kube_vip_svc_election: "false"
kube_vip_interface: ens3
kube_vip_port: 16443

node_exporter_version: "1.12.1"
node_exporter_sha256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
node_exporter_port: 9100
node_exporter_allowed_source: 192.168.100.1
node_exporter_collectors:
  - cpu
  - meminfo
  - diskstats
  - filesystem
  - netdev
  - loadavg

nginx_image: nginx:1.30.6@sha256:eb1c896deef834f4e056829fd6dadac8305501f16cc71ba65fb252c8d0aa168e
nginx_cpu_limit: "500m"
nginx_cpu_request: "{{ nginx_cpu_limit }}"
nginx_memory: 128Mi
app_node: microk8s-node2
lb_ip: 192.168.100.150
