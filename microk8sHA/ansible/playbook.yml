---
# Playbook principal para configurar el clúster microk8s en alta disponibilidad

# Play 1: configurar nodo principal y levantar el VIP
- name: Configurar nodo principal del clúster microk8s
  hosts: microk8s-node1
  become: true
  force_handlers: true
  roles:
    # Rol de preparación general del sistema
    - common
    # Rol de configuración segura de SSH
    - ssh_config
    # Rol de instalación y configuración de microk8s
    - microk8s_server
    # Rol de kube-vip para IP virtual del plano de control (ARP)
    - kube_vip
  tasks:
    # Esperar a que la API de microk8s responda a través del VIP (kube-vip
    # anuncia por ARP directo al puerto real del API server, sin proxy TCP)
    - name: Esperar API de microk8s en el VIP
      wait_for:
        host: "{{ vip_address }}"
        port: 16443
        timeout: 180

# Play 2: unir nodos adicionales directamente al nodo principal
- name: Configurar nodos adicionales del clúster microk8s
  hosts: microk8s-node2:microk8s-node3
  become: true
  force_handlers: true
  roles:
    # Rol de preparación general del sistema
    - common
    # Rol de configuración segura de SSH
    - ssh_config
    # Rol de instalación y configuración de microk8s
    - microk8s_server
    # Rol de kube-vip para IP virtual del plano de control (ARP)
    - kube_vip
