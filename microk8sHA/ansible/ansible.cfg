# Configuración predeterminada de Ansible
[defaults]
# Archivo de inventario
inventory = ./inventory.ini
# Usuario remoto y llave privada se definen en el inventario generado por Terraform
# Deshabilitar verificación de llaves de host
host_key_checking = False
# Deshabilitar archivos de reintento
retry_files_enabled = False
# Margen extra sobre el default (10s): un login con tty puede tardar unos
# segundos por overhead de red/banner antes de que aparezca el prompt de
# privilege escalation.
timeout = 30

# Configuración de escalado de privilegios
[privilege_escalation]
# Habilitar become (sudo)
become = True
# Método de escalado
become_method = sudo
# Usuario objetivo
become_user = root
# No solicitar contraseña para sudo
become_ask_pass = False
