---
# Rol keepalived: configuración de alta disponibilidad con IP virtual

# Instalar el paquete keepalived
- name: Instalar keepalived
  apt:
    name: keepalived
    state: present

# Desplegar la configuración de keepalived desde la plantilla
- name: Configurar keepalived
  template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    mode: '0644'

# Reiniciar y habilitar el servicio (mismo patrón que haproxy: garantizar que el
# servicio quede corriendo con la config desplegada sin depender de handlers)
- name: Reiniciar y habilitar servicio keepalived
  systemd:
    name: keepalived
    enabled: true
    state: restarted