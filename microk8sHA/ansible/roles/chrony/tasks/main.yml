---
- name: Instalar chrony (apt retira systemd-timesyncd por conflicto)
  apt:
    name: chrony
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configurar chrony con el host como única fuente
  template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    mode: '0644'
  notify: Reiniciar chrony

- name: Habilitar e iniciar chrony
  systemd:
    name: chrony
    enabled: true
    state: started

- name: Aplicar la configuración antes de verificar
  meta: flush_handlers

- name: Esperar a que el host sea la fuente seleccionada
  command: chronyc -n sources
  register: chrony_sources
  changed_when: false
  retries: 15
  delay: 4
  until: "('^* ' ~ chrony_servidor) in chrony_sources.stdout"
