---
# Rol haproxy: configuración del balanceador de carga para la API de microk8s

# Instalar el paquete haproxy
- name: Instalar haproxy
  apt:
    name: haproxy
    state: present

# Eliminar el override legacy que esperaba al VIP para arrancar (generaba
# daemon-reload pendiente y fallaba el reinicio del servicio)
- name: Eliminar override legacy de espera de VIP
  file:
    path: /etc/systemd/system/haproxy.service.d/override.conf
    state: absent
  register: cambio_override

# Recargar systemd si se eliminó el override (evita el warning de unit file changed)
- name: Recargar systemd tras eliminar override
  systemd:
    daemon_reload: true
  when: cambio_override.changed

# Desplegar la configuración de haproxy desde la plantilla
- name: Configurar haproxy
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: '0644'

# Reiniciar y habilitar el servicio (state=restarted: el paquete auto-inicia
# haproxy con su config por defecto, que no escucha en 16443; sin reiniciar
# aquí, el VIP nunca responde. El bind es 0.0.0.0, no depende del VIP)
- name: Reiniciar y habilitar servicio haproxy
  systemd:
    name: haproxy
    enabled: true
    state: restarted