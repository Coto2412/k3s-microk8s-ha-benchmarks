---
scaphandre_repo: https://github.com/hubblo-org/scaphandre.git
scaphandre_version: v1.0.3
scaphandre_commit: b64443c447e24f25947111ec8611449f213eb0a5
scaphandre_clone_dest: /opt/scaphandre-src
scaphandre_rust_version: "1.98.1"

scaphandre_exporter_bind: 127.0.0.1
scaphandre_exporter_port: 8080

node_exporter_version: "1.12.1"
node_exporter_sha256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
node_exporter_bind: 127.0.0.1
node_exporter_port: 9100
node_exporter_collectors:
  - cpu
  - meminfo
  - diskstats
  - filesystem
  - netdev
  - loadavg

prometheus_version: "3.15.0"
prometheus_sha256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
prometheus_bind: 127.0.0.1
prometheus_port: 9090
prometheus_scrape_interval: 10s
prometheus_retention: 90d
prometheus_data_dir: /var/lib/prometheus/data

active_distribution: k3s

vm_ips:
  - 192.168.100.11
  - 192.168.100.12
  - 192.168.100.13

cluster_vip: 192.168.100.100
kube_state_metrics_nodeport: 30080

k6_version: "2.3.0"
k6_sha256: 39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1

chrony_red_vms: 192.168.100.0/24
chrony_ip_host: 192.168.100.1

operador_host: "{{ lookup('env', 'USER') }}"

medicion_unidades_permitidas:
  - chrony\.service
  - node_exporter\.service
  - prometheus\.service
  - scaphandre\.service
  - ssh\.service
  - NetworkManager(-dispatcher)?\.service
  - wpa_supplicant\.service
  - dbus\.(service|socket)
  - polkit\.service
  - power-profiles-daemon\.service
  - rsyslog\.service
  - syslog\.socket
  - networkd-dispatcher\.service
  - (serial-)?getty@.*\.service
  - user(-runtime-dir)?@.*\.service
  - systemd-.*
  - (lib)?virt.*
  - dm-event\.socket
  - lvm2-.*
  - uuidd\.socket
medicion_servicios_requeridos:
  - chrony.service
  - node_exporter.service
  - prometheus.service
  - scaphandre.service
  - ssh.service
medicion_perfil_energia: balanced
medicion_boost_cpu: 0
# 100 ms: cordura; las fuentes NTP externas tienen desviación de 11-28 ms (ver docs/evidencia/evidencia_T-20.md, 3.5)
medicion_reloj_umbral_host_ms: 100
medicion_reloj_umbral_vm_ms: 5
medicion_reloj_espera_max_s: 180
