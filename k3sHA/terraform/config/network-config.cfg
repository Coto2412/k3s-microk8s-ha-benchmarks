# Configuración de red para cloud-init (netplan).
# IP asignada por DHCP de libvirt vía reserva de host por MAC
# (ver `addresses` en network_interface, main.tf) — no se fija IP estática
# aquí, así el mismo template sirve para cualquier IP que reserve Terraform.
version: 2
ethernets:
  ens3:
    match:
      macaddress: "${mac_address}"
    set-name: "ens3"
    dhcp4: true
    dhcp6: false
    optional: true
