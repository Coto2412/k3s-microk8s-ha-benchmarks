#cloud-config
# Configuración de cloud-init para cada máquina virtual
hostname: ${hostname}
fqdn: ${hostname}.k3s-tesis.local
# Sin esto, /etc/hosts no tiene entrada propia y cada `sudo` espera el
# timeout de DNS resolviendo el hostname propio (~15s cada vez, medido en
# microk8sHA). Se aplica igual acá por consistencia y prevención.
manage_etc_hosts: true

# Configuración del usuario del clúster con acceso sudo sin contraseña
users:
  - name: ${cluster_user}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

# Deshabilitar acceso por contraseña SSH
ssh_pwauth: false



# Actualizar índices de paquetes al iniciar
# Sin upgrade automático: un apt upgrade instalaría kernel/paquetes "más recientes"
# en cada reconstrucción, rompiendo la reproducibilidad de las mediciones energéticas
package_update: true
package_upgrade: false

# Paquetes adicionales a instalar
packages:
  - qemu-guest-agent

# Comandos a ejecutar después de la configuración inicial
runcmd:
  # Habilitar e iniciar el agente invitado de QEMU
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent
  # Forzar aplicación de netplan y activación de la interfaz
  - netplan generate
  - netplan apply
  - ip link set ens3 up
  # Apagar el chequeo de red de motd-news/ESM en cada login: sin esto, una
  # sesión SSH con tty (la que usa Ansible para el prompt de sudo) puede
  # tardar >12s esperando esa llamada de red, disparando timeout de
  # privilege escalation. También es ruido de red no determinístico que
  # contaminaría las mediciones energéticas.
  - chmod -x /etc/update-motd.d/50-motd-news /etc/update-motd.d/91-contract-ua-esm-status 2>/dev/null || true
  - systemctl disable --now apt-news.service 2>/dev/null || true
  - systemctl mask motd-news.service motd-news.timer 2>/dev/null || true
  - systemctl disable --now ua-timer.timer 2>/dev/null || true

# Mensaje final de cloud-init
final_message: "Cloud init finalizó en $UPTIME segundos"
