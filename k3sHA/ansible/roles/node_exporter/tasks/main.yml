---
- name: Crear usuario de sistema node_exporter
  user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Descargar node_exporter con checksum fijado
  get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp/node_exporter.tar.gz
    checksum: "sha256:{{ node_exporter_sha256 }}"
    mode: '0644'

- name: Extraer node_exporter
  unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /tmp
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

- name: Instalar binario de node_exporter en /usr/local/bin
  copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  notify: Reiniciar node_exporter

- name: Verificar nombres de colectores con --help
  command: /usr/local/bin/node_exporter --help
  register: node_exporter_help
  changed_when: false
  failed_when: false

- name: Confirmar que los colectores configurados existen en esta versión
  assert:
    that:
      - "('collector.' + item + ' ') in (node_exporter_help.stdout + node_exporter_help.stderr)"
    fail_msg: "El colector collector.{{ item }} no aparece en --help de node_exporter {{ node_exporter_version }}."
  loop: "{{ node_exporter_collectors }}"

- name: Desplegar unidad systemd de node_exporter
  template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'
  notify:
    - Recargar systemd
    - Reiniciar node_exporter

- name: Habilitar e iniciar node_exporter
  systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Esperar a que node_exporter responda
  wait_for:
    host: "{{ ansible_host }}"
    port: "{{ node_exporter_port }}"
    timeout: 30

- name: Instalar ufw
  apt:
    name: ufw
    state: present

- name: Fijar política por defecto de ufw en permitir entrante
  community.general.ufw:
    direction: incoming
    default: allow

- name: Permitir node_exporter solo desde el host físico
  community.general.ufw:
    rule: allow
    port: "{{ node_exporter_port }}"
    proto: tcp
    from_ip: "{{ node_exporter_allowed_source }}"

- name: Denegar por defecto el acceso a node_exporter
  community.general.ufw:
    rule: deny
    port: "{{ node_exporter_port }}"
    proto: tcp

- name: Activar ufw
  community.general.ufw:
    state: enabled
