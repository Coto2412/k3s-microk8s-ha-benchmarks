---
# Rol haproxy: configuración del balanceador de carga para la API de k3s

# Instalar el paquete haproxy
- name: Instalar haproxy
  apt:
    name: haproxy
    state: present

# Desplegar la configuración de haproxy desde la plantilla
- name: Configurar haproxy
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: '0644'

# Reiniciar y habilitar el servicio (state=restarted: el paquete auto-inicia
# haproxy con su config por defecto, que no escucha en 6443; sin reiniciar
# aquí, el VIP nunca responde)
- name: Reiniciar y habilitar servicio haproxy
  systemd:
    name: haproxy
    enabled: true
    state: restarted
