---
# Rol k3s_server: instalación y configuración del clúster k3s en alta disponibilidad

# Verificar si k3s ya está instalado
- name: Verificar si k3s ya está instalado
  stat:
    path: /usr/local/bin/k3s
  register: k3s_installed

# Descargar el script de instalación de k3s
- name: Descargar script de instalación de k3s
  get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: '0755'
  when: not k3s_installed.stat.exists

# Construir lista de --tls-san: VIP + IP real de cada nodo del clúster.
# Dinámico (no hardcodeado) para que sobreviva cualquier renumeración de IPs.
- name: Construir lista de tls-san
  set_fact:
    k3s_tls_sans: >-
      --tls-san {{ vip_address }}
      {% for host in groups['k3s_cluster'] %}--tls-san {{ hostvars[host]['ansible_host'] }} {% endfor %}

# Instalar k3s en el primer nodo como servidor inicial del clúster
- name: Instalar k3s en el primer nodo
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    # Sin --bind-address: la API queda en wildcard (0.0.0.0). Es obligatorio
    # para kube-vip en modo ARP — la VIP resuelve por ARP a la MAC del nodo
    # líder, pero si la API solo escucha en su IP propia nadie responde en
    # <VIP>:6443. (Antes se fijaba a la IP propia para coexistir con
    # HAProxy en 0.0.0.0:6443; HAProxy ya no existe.)
    # --disable traefik/servicelb: Traefik no es parte del diseño (la app
    # de referencia es NGINX mínimo) y su Service LoadBalancer automático
    # rompió kube-vip (ver rol kube_vip). También mantiene simetría con
    # MicroK8s, que no trae nada de esto por defecto.
    INSTALL_K3S_EXEC: "--cluster-init --disable traefik --disable servicelb {{ k3s_tls_sans }}"
  command: /tmp/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  when: inventory_hostname == 'k3s-node1'
  register: k3s_first_node

# Esperar a que el token esté disponible en el primer nodo
- name: Esperar token de k3s en el primer nodo
  wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    state: present
    timeout: 60
  delegate_to: k3s-node1
  run_once: true

# Leer el token de unión desde el primer nodo
- name: Leer token de k3s desde el primer nodo
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_slurp
  delegate_to: k3s-node1
  run_once: true

# Establecer el token como variable en todos los nodos del play
- name: Establecer token de k3s como variable
  set_fact:
    k3s_token: "{{ k3s_token_slurp.content | b64decode | trim }}"

# Validar que el token esté disponible para los nodos adicionales
- name: Validar token de k3s en nodos adicionales
  assert:
    that:
      - k3s_token is defined
      - k3s_token | length > 0
    fail_msg: "Token de k3s no disponible para unir el nodo al clúster"
  when: inventory_hostname != 'k3s-node1'

# Instalar k3s en los nodos adicionales, uniéndolos directamente al primer servidor
- name: Instalar k3s en nodos adicionales
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "--server https://{{ hostvars['k3s-node1']['ansible_host'] }}:6443 --token {{ k3s_token }} --disable traefik --disable servicelb {{ k3s_tls_sans }}"
  command: /tmp/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  when: inventory_hostname != 'k3s-node1'

# Crear directorio de configuración kube para el usuario del clúster
- name: Crear directorio kube config
  file:
    path: "/home/{{ cluster_user }}/.kube"
    state: directory
    owner: "{{ cluster_user }}"
    group: "{{ cluster_user }}"
    mode: '0755'

# Copiar el archivo kubeconfig de k3s al directorio del usuario
- name: Copiar kubeconfig de k3s al usuario
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ cluster_user }}/.kube/config"
    remote_src: true
    owner: "{{ cluster_user }}"
    group: "{{ cluster_user }}"
    mode: '0600'
  notify: Actualizar servidor en kubeconfig
  when: inventory_hostname == 'k3s-node1'

# Agregar variable de entorno KUBECONFIG al bashrc del usuario
- name: Agregar KUBECONFIG al bashrc
  lineinfile:
    path: "/home/{{ cluster_user }}/.bashrc"
    line: 'export KUBECONFIG=/home/{{ cluster_user }}/.kube/config'
    create: true
    owner: "{{ cluster_user }}"
    group: "{{ cluster_user }}"
    mode: '0644'
