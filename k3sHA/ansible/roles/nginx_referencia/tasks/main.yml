---
- name: Desplegar manifiestos de la aplicación de referencia
  template:
    src: "{{ playbook_dir }}/../../k8s/{{ item }}.yaml.j2"
    dest: "/var/lib/rancher/k3s/server/manifests/{{ item }}.yaml"
    mode: '0644'
  loop:
    - nginx-deployment
    - nginx-service

- name: Esperar a que NGINX de referencia esté listo
  command: kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml -n default rollout status deploy/nginx-referencia --timeout=180s
  changed_when: false
  register: nginx_rollout
  retries: 3
  delay: 10
  until: nginx_rollout.rc == 0
